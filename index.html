<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Revalidate the HTML on every load (always fresh after a redeploy) but let the browser
     reuse a cached copy on a 304. Authoritative caching headers are set in .htaccess. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d2e5c">
<title>Kenchic · Myth or Fact</title>
<meta name="description" content="Kenchic Myth or Fact: read the statement and tap MYTH or FACT before the 10 seconds run out.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kenchic · Myth or Fact">
<meta property="og:description" content="One statement. Ten seconds. Myth or fact?">
<meta property="og:image" content="assets/myth-or-fact/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<!-- Board artwork paints the header, so fetch it during parse. Built by source/build_myth_or_fact.py -->
<link rel="preload" as="image" href="assets/myth-or-fact/header.webp?v=1" fetchpriority="high">
<link rel="preload" as="image" href="assets/myth-or-fact/pattern.webp?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Questrial&display=swap">
<style>
  :root{
    --navy:#1d2e5c;     /* board pattern, dark tone */
    --red:#df3633;      /* MYTH OR FACT red */
    --yellow:#e3a20b;   /* MYTH card */
    --green:#1e9e4a;    /* right answer */
    --ink:#1d2e5c;
    /* One "design pixel". It is 1px on phones; on big screens (event displays, tablets,
       laptops) it grows until the 620-wide game fills the width or its ~880 height fills
       the screen, whichever comes first — so the whole game scales up as one. */
    --u:max(1px, min(100vw / 620, 100vh / 880));
    /* The header IS the board artwork, scaled so the MYTH OR FACT title is --tw wide.
       Both background layers and the masthead spacer derive from --bw, so the baked-in
       logo/title and the pattern below always line up at every screen size. */
    --tw:min(84vw, calc(420 * var(--u)));
    --bw:calc(var(--tw) * 1.968);   /* 1600px board / 813px title */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    min-height:100vh; min-height:100svh;
    background:var(--navy); color:#fff;
    font-family:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-text-size-adjust:100%;
  }
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  /* ---------- page column ---------- */
  .app{
    display:flex; flex-direction:column;
    width:100%; max-width:calc(620 * var(--u)); min-height:100vh; min-height:100svh; margin:0 auto;
    padding:0 clamp(14px, 4vw, calc(24 * var(--u))) calc(16 * var(--u) + env(safe-area-inset-bottom));
    background:
      url("assets/myth-or-fact/header.webp?v=1") center top / var(--bw) auto no-repeat,
      url("assets/myth-or-fact/pattern.webp?v=1") center calc(var(--bw) * .36125) / var(--bw) auto repeat-y, /* 578/1600 */
      var(--navy);
  }
  @media (min-width:700px){ .app{box-shadow:0 0 60px rgba(0,0,0,.35);} }
  .masthead{flex:0 0 auto; height:calc(var(--bw) * .2325);} /* down to the title baseline */
  .instr{margin:clamp(8px, 1.6svh, calc(16 * var(--u))) 0 0; text-align:center; font-family:"Questrial",sans-serif;
    font-size:calc(var(--tw) * .042); letter-spacing:.02em;}

  /* statement + cards sit together right under the title; tall screens leave the
     spare height below the cards, not as a gap above the statement */
  .play{flex:1 0 auto; display:flex; flex-direction:column; justify-content:flex-start;
    gap:clamp(10px, 2.2svh, calc(22 * var(--u))); padding-top:clamp(8px, 1.6svh, calc(16 * var(--u)));}

  /* ---------- statement area ---------- */
  .stage{display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(8px, 1.6svh, calc(14 * var(--u))); min-height:clamp(200px, 33svh, calc(290 * var(--u)));}
  .badge{height:calc(52 * var(--u)); display:flex; align-items:center; justify-content:center;}

  .timer{position:relative; width:calc(52 * var(--u)); height:calc(52 * var(--u)); border-radius:50%; background:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.3);}
  .timer svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg);}
  .timer circle{fill:none; stroke-width:4;}
  .timer .track{stroke:#e3e8f3;}
  .timer .ring{stroke:var(--yellow); stroke-linecap:round; stroke-dasharray:131.95; stroke-dashoffset:0;}
  .timer b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--ink); font-weight:700; font-size:calc(22 * var(--u)); font-variant-numeric:tabular-nums;}
  .timer.low .ring{stroke:var(--red);}
  .timer.low b{color:var(--red); animation:beat 1s ease infinite;}

  .verdict{display:inline-flex; align-items:center; gap:.35em; height:calc(44 * var(--u)); padding:0 calc(20 * var(--u));
    border-radius:999px; font-weight:600; font-size:clamp(15px, 4.4vw, calc(19 * var(--u))); color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
    animation:pop .35s ease both;}
  .verdict b{font-weight:700;}
  .verdict.right{background:var(--green);}
  .verdict.wrong{background:var(--red);}
  .verdict.timeout{background:#fff; color:var(--ink);}
  .verdict.timeout b{color:var(--red);}

  .qcard{width:100%; max-width:calc(480 * var(--u)); padding:clamp(14px, 2.4svh, calc(22 * var(--u))) calc(20 * var(--u));
    border-radius:calc(18 * var(--u)); background:#fff; color:var(--ink); text-align:center;
    box-shadow:0 14px 32px rgba(0,0,0,.35);}
  .qcard.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;}
  .statement{margin:0; font-weight:600; font-size:clamp(18px, 5.2vw, calc(25 * var(--u))); line-height:1.25;}

  .btn{
    appearance:none; cursor:pointer; touch-action:manipulation;
    min-width:calc(220 * var(--u)); padding:calc(14 * var(--u)) calc(40 * var(--u)); border-radius:calc(18 * var(--u));
    background:linear-gradient(180deg,#fff,#eef3ff); color:var(--ink);
    border:2px solid rgba(255,255,255,.95);
    font:700 calc(20 * var(--u))/1 "Fredoka",sans-serif; letter-spacing:.5px;
    box-shadow:0 calc(7 * var(--u)) 0 #c9d4f0,0 14px 28px rgba(0,0,0,.34);
  }
  .btn:active{transform:translateY(calc(4 * var(--u))); animation:none;
    box-shadow:0 calc(3 * var(--u)) 0 #c9d4f0,0 7px 14px rgba(0,0,0,.32);}
  #startBtn{font-size:calc(24 * var(--u)); padding:calc(18 * var(--u)) calc(52 * var(--u));
    animation:pulse 2.4s ease-in-out infinite;}

  /* what shows in each state */
  .app[data-state="ready"] .badge,
  .app[data-state="ready"] .qcard,
  .app[data-state="ready"] #nextBtn,
  .app:not([data-state="ready"]) #startBtn,
  .app[data-state="question"] .verdict,
  .app[data-state="done"] .timer{display:none;}
  .app[data-state="question"] #nextBtn{visibility:hidden;} /* hold its space so nothing jumps */

  /* ---------- MYTH / FACT cards ---------- */
  .boards{display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px, 4vw, calc(24 * var(--u)));
    width:100%; max-width:calc(560 * var(--u)); margin:0 auto;}
  .board{
    appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit;
    cursor:pointer; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
    width:100%; aspect-ratio:635/694; max-height:32svh; min-height:130px;
    border-radius:clamp(16px, 5vw, calc(30 * var(--u)));
    background:var(--card); box-shadow:0 10px 24px rgba(0,0,0,.3);
    transition:background-color .25s ease, filter .25s ease, transform .15s ease;
  }
  .board.myth{--card:var(--yellow); --label:#fff;}
  .board.fact{--card:#fff; --label:var(--red);}
  .board.is-right{--card:var(--green); --label:#fff; animation:bump .4s ease;}
  .board.is-wrong{--card:var(--red); --label:#fff; animation:shake .4s ease;}
  .board.is-dim{filter:saturate(.2) brightness(.6);} /* stays opaque so the pattern doesn't show through */
  .board:disabled{cursor:default;}
  .board:not(:disabled):active{transform:scale(.97);}
  .board:focus-visible{outline:3px solid #fff; outline-offset:3px;}

  /* wordmarks are alpha masks cut from the board, filled with --label */
  .label{display:block; margin-top:7%;}
  .label i{display:block; background:var(--label); transition:background-color .25s ease;
    -webkit-mask:var(--mask) center / contain no-repeat; mask:var(--mask) center / contain no-repeat;}
  .board.myth .label{width:55%; filter:drop-shadow(0 2px 1px rgba(120,70,0,.35));}
  .board.myth .label i{--mask:url("assets/myth-or-fact/myth-label.png?v=1"); aspect-ratio:657/201;}
  .board.fact .label{width:47%;}
  .board.fact .label i{--mask:url("assets/myth-or-fact/fact-label.png?v=1"); aspect-ratio:546/213;}
  .board.is-right .label, .board.is-wrong .label{filter:none;}

  .mark{flex:1; width:100%; display:flex; align-items:center; justify-content:center;}
  .mark svg{display:none; width:clamp(44px, 32%, calc(84 * var(--u))); height:auto;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.25)); animation:pop .35s ease both;}
  .board.is-right .mark .ok, .board.is-wrong .mark .no{display:block;}

  /* ---------- confetti ---------- */
  #confetti{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden;}
  #confetti i{position:absolute; top:-12%; border-radius:2px; animation:fall linear forwards;}

  @keyframes pop{from{opacity:0; transform:scale(.6);} to{opacity:1; transform:none;}}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.04);}}
  @keyframes beat{0%,100%{transform:scale(1);} 50%{transform:scale(1.18);}}
  @keyframes bump{0%{transform:scale(1);} 45%{transform:scale(1.06);} 100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:none;} 20%,60%{transform:translateX(-6px);} 40%,80%{transform:translateX(6px);}}
  @keyframes fall{0%{transform:translateY(0) rotate(0); opacity:1;} 100%{transform:translateY(118vh) rotate(620deg); opacity:.9;}}

  /* short phones (small Androids, browser bars showing): tighten so it all fits */
  @media (max-height:620px){
    .stage{min-height:0;}
    .badge, .timer{height:44px;}
    .timer{width:44px;}
    .timer b{font-size:19px;}
    .verdict{height:38px;}
    .btn{padding:11px 32px; font-size:18px;}
    #startBtn{padding:14px 44px; font-size:22px;}
    .board{min-height:110px;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation:none !important; transition:none !important;}
    #confetti{display:none;}
  }
</style>
</head>
<body>
  <div class="app" id="app" data-state="ready">
    <header class="masthead"><h1 class="sr">Kenchic: Myth or Fact</h1></header>
    <p class="instr">TAP THE RIGHT CARD BEFORE TIME RUNS OUT</p>

    <main class="play">
      <div class="stage">
        <div class="badge">
          <div class="timer" id="timer" role="timer" aria-label="Seconds left">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle class="track" cx="24" cy="24" r="21"/><circle class="ring" id="ring" cx="24" cy="24" r="21"/>
            </svg>
            <b id="clock">10</b>
          </div>
          <div class="verdict" id="verdict" role="status"></div>
        </div>
        <div class="qcard" id="qcard"><p class="statement" id="statement"></p></div>
        <button class="btn" id="startBtn" type="button">START</button>
        <button class="btn" id="nextBtn" type="button">NEXT PLAYER</button>
      </div>

      <div class="boards">
        <button class="board myth" id="mythBtn" type="button" data-pick="MYTH" aria-label="Myth" disabled>
          <span class="label"><i></i></span>
          <span class="mark" aria-hidden="true">
            <svg class="ok" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M14 25l7 7 13-15" fill="none" stroke="#1e9e4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="no" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M16 16l16 16M32 16L16 32" stroke="#df3633" stroke-width="5" stroke-linecap="round"/></svg>
          </span>
        </button>
        <button class="board fact" id="factBtn" type="button" data-pick="FACT" aria-label="Fact" disabled>
          <span class="label"><i></i></span>
          <span class="mark" aria-hidden="true">
            <svg class="ok" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M14 25l7 7 13-15" fill="none" stroke="#1e9e4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="no" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M16 16l16 16M32 16L16 32" stroke="#df3633" stroke-width="5" stroke-linecap="round"/></svg>
          </span>
        </button>
      </div>
    </main>
  </div>
  <div id="confetti" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  // ----- config -----
  // One statement per player, dealt at random. `a` is the right card.
  var STATEMENTS = [
    { s:"Chicken is only a source of protein.",                              a:"MYTH" },
    { s:"All chicken has the same fat content.",                             a:"MYTH" },
    { s:"You must eat chicken every day to get enough protein.",             a:"MYTH" },
    { s:"Fried chicken has the same nutritional value as grilled chicken.",  a:"MYTH" },
    { s:"Washing raw chicken makes it safer to eat.",                        a:"MYTH" },
    { s:"Chicken is a good source of high-quality protein.",                 a:"FACT" },
    { s:"Chicken can be part of a balanced diet.",                           a:"FACT" },
    { s:"Chicken contains important B vitamins.",                            a:"FACT" },
    { s:"Chicken protein helps with muscle repair and recovery.",             a:"FACT" },
    { s:"Chicken can support an active lifestyle.",                          a:"FACT" }
  ];
  var TIME = 10;                  // seconds per statement
  var RING = 2 * Math.PI * 21;    // timer ring circumference (r=21 in the SVG)

  // ----- state -----
  var bag = [], current = null, deadline = 0, raf = 0;

  var $ = function(id){ return document.getElementById(id); };
  var app = $("app"), mythBtn = $("mythBtn"), factBtn = $("factBtn");

  function rint(n){ return Math.floor(Math.random()*n); }

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=rint(i+1); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  // Deal from a shuffled bag so no statement repeats until all of them have been
  // played — and never the same one twice in a row across a reshuffle.
  function deal(){
    if(!bag.length){
      bag = shuffle(STATEMENTS.slice());
      if(bag[bag.length-1] === current){ bag.unshift(bag.pop()); }
    }
    return bag.pop();
  }

  function setState(s){ app.setAttribute("data-state", s); }

  function resetBoards(enabled){
    [mythBtn, factBtn].forEach(function(b){
      b.classList.remove("is-right","is-wrong","is-dim");
      b.disabled = !enabled;
    });
  }

  // ---- flow ----
  function start(){
    current = deal();
    $("statement").textContent = current.s;
    resetBoards(true);
    setState("question");
    var q = $("qcard");
    q.classList.remove("pop"); void q.offsetWidth; q.classList.add("pop"); // replay the pop
    deadline = performance.now() + TIME*1000;
    tick();
  }

  // Driven off a deadline (not a counter) so it can't drift, and a backgrounded tab
  // comes back to the right answer: time's up.
  function tick(){
    var left = Math.max(0, deadline - performance.now());
    var secs = Math.ceil(left/1000);
    $("clock").textContent = secs;
    $("ring").style.strokeDashoffset = RING * (1 - left/(TIME*1000));
    $("timer").classList.toggle("low", secs <= 3);
    if(left <= 0){ finish(null); return; }
    raf = requestAnimationFrame(tick);
  }

  // pick: "MYTH" | "FACT" | null (time ran out)
  function finish(pick){
    cancelAnimationFrame(raf);
    mythBtn.disabled = factBtn.disabled = true;
    var kind, head;
    if(pick === null){
      mythBtn.classList.add("is-dim"); factBtn.classList.add("is-dim");
      kind = "timeout"; head = "TIME'S UP!";
    } else {
      var right = pick === current.a;
      var chosen = pick === "MYTH" ? mythBtn : factBtn;
      chosen.classList.add(right ? "is-right" : "is-wrong");
      (chosen === mythBtn ? factBtn : mythBtn).classList.add("is-dim");
      kind = right ? "right" : "wrong"; head = right ? "CORRECT!" : "WRONG!";
      if(right) confetti(true);
    }
    var v = $("verdict"), b = document.createElement("b");
    b.textContent = head;
    v.className = "verdict " + kind;
    v.textContent = "";
    v.appendChild(b);
    v.appendChild(document.createTextNode(" It's a " + current.a));
    setState("done");
  }

  function nextPlayer(){
    confetti(false);
    resetBoards(false);
    setState("ready");
  }

  // ---- confetti ----
  function confetti(on){
    var c=$("confetti"); c.innerHTML="";
    if(!on) return;
    var cols=["#df3633","#ffffff","#e3a20b","#1e9e4a","#2a63d6"];
    for(var i=0;i<52;i++){
      var p=document.createElement("i");
      var size=6+rint(8);
      p.style.left=rint(100)+"%";
      p.style.background=cols[rint(cols.length)];
      p.style.width=size+"px";
      p.style.height=(size*0.5+4)+"px";
      p.style.animationDuration=(2.4+Math.random()*1.8)+"s";
      p.style.animationDelay=(Math.random()*0.5)+"s";
      c.appendChild(p);
    }
  }

  // ---- wire up ----
  $("startBtn").addEventListener("click", start);
  $("nextBtn").addEventListener("click", nextPlayer);
  [mythBtn, factBtn].forEach(function(b){
    b.addEventListener("click", function(){
      if(app.getAttribute("data-state") === "question") finish(b.getAttribute("data-pick"));
    });
  });
})();
</script>
</body>
</html>
