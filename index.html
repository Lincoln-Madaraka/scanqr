<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D2E5C">

  <title>Kenchic UCL Word Hunt — Arsenal vs PSG</title>
  <meta name="description" content="A Champions League word hunt by Kenchic. Find 6 football names in 30 seconds. Arsenal vs PSG edition.">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kenchic UCL Word Hunt">
  <meta property="og:title" content="Kenchic UCL Word Hunt — Arsenal vs PSG">
  <meta property="og:description" content="Find 6 football names in 30 seconds. A Kenchic Champions League word hunt.">
  <meta property="og:image" content="assets/og-image.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kenchic UCL Word Hunt — Arsenal vs PSG">
  <meta name="twitter:description" content="Find 6 football names in 30 seconds.">
  <meta name="twitter:image" content="assets/og-image.jpg">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="assets/icon-192.png" alt="Kenchic" width="36" height="36">
        <div class="brand-text">
          <span class="brand-name">Kenchic</span>
          <span class="brand-sub">UCL Word Hunt</span>
        </div>
      </div>
      <div class="score" aria-label="Session score">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/>
          <path d="M5 4H3v3a3 3 0 0 0 3 3M19 4h2v3a3 3 0 0 1-3 3"/>
        </svg>
        <span id="session-score">0</span>
      </div>
    </header>

    <section class="play-area">
      <div class="play-head">
        <p class="prompt" id="prompt">Loading…</p>
        <div class="timer" aria-label="Time remaining">
          <svg class="timer-ring" viewBox="0 0 40 40" width="44" height="44" aria-hidden="true">
            <circle class="timer-track" cx="20" cy="20" r="17"></circle>
            <circle class="timer-progress" id="timer-progress" cx="20" cy="20" r="17"
                    stroke-dasharray="106.81" stroke-dashoffset="0" transform="rotate(-90 20 20)"></circle>
          </svg>
          <span class="timer-text" id="timer-text">30</span>
        </div>
      </div>
      <div class="grid" id="grid" role="grid" aria-label="Word search grid"></div>
    </section>

    <footer class="bottombar">
      <div class="found-pill">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span><span id="found-count">0</span> / 6 found</span>
      </div>
      <div class="brand-strip" aria-hidden="true">
        <span class="star"></span>
        <span class="star"></span>
        <span class="brand-mark">KENCHIC × UCL</span>
        <span class="star"></span>
        <span class="star"></span>
      </div>
    </footer>
  </div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon"></div>
      <h2 class="modal-title" id="modal-title">Champion!</h2>
      <p class="modal-sub" id="modal-sub">You found all 6.</p>
      <div class="modal-grid" id="modal-grid" hidden></div>
      <button class="next-btn" id="next-btn" type="button">
        <span>Next puzzle</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>

  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
